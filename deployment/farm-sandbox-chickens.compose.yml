name: farm-sandbox-chickens

services:
  farm-sandbox-chickens:
    build:
      context: ..
      dockerfile: Farm.Sandbox.Chickens/Dockerfile
    environment:
      TZ: ${FARM_CHICKENS_TIMEZONE:-Etc/UTC}
      FARM_AZURE_DEVOPS_ORGANIZATION_URL: ${FARM_AZURE_DEVOPS_ORGANIZATION_URL:?set FARM_AZURE_DEVOPS_ORGANIZATION_URL}
      FARM_AZURE_DEVOPS_PROJECT: ${FARM_AZURE_DEVOPS_PROJECT:?set FARM_AZURE_DEVOPS_PROJECT}
      FARM_AZURE_DEVOPS_PAT: ${FARM_AZURE_DEVOPS_PAT:?set FARM_AZURE_DEVOPS_PAT}
      FARM_CHICKENS_GIT_AUTH_USER: ${FARM_CHICKENS_GIT_AUTH_USER:-x-access-token}
      FARM_CHICKENS_GIT_AUTH_TOKEN: ${FARM_CHICKENS_GIT_AUTH_TOKEN:-}
      FARM_CHICKENS_GIT_USER_NAME: ${FARM_CHICKENS_GIT_USER_NAME:?set FARM_CHICKENS_GIT_USER_NAME}
      FARM_CHICKENS_GIT_USER_EMAIL: ${FARM_CHICKENS_GIT_USER_EMAIL:?set FARM_CHICKENS_GIT_USER_EMAIL}
      FARM_CHICKENS_BASE_BRANCH: ${FARM_CHICKENS_BASE_BRANCH:?set FARM_CHICKENS_BASE_BRANCH}
      FARM_CHICKENS_ENABLE_PUSH: ${FARM_CHICKENS_ENABLE_PUSH:?set FARM_CHICKENS_ENABLE_PUSH explicitly to true to publish}
      FARM_CHICKENS_REPOSITORY_PATH: ${FARM_CHICKENS_REPOSITORY_CONTAINER_PATH:-/workspace/repository}
      FARM_CHICKENS_ARTIFACTS_PATH: ${FARM_CHICKENS_ARTIFACTS_CONTAINER_PATH:-/workspace/artifacts}
      FARM_CHICKENS_STATE_CONTAINER_PATH: ${FARM_CHICKENS_STATE_CONTAINER_PATH:-/workspace/state}
      FARM_CHICKENS_STATE_PATH: ${FARM_CHICKENS_STATE_PATH:-${FARM_CHICKENS_STATE_CONTAINER_PATH:-/workspace/state}/chickens.db}
      FARM_CHICKENS_STATUS_PATH: ${FARM_CHICKENS_STATUS_PATH:-${FARM_CHICKENS_STATE_CONTAINER_PATH:-/workspace/state}/status.json}
      FARM_CHICKENS_LOCK_PATH: ${FARM_CHICKENS_LOCK_PATH:-${FARM_CHICKENS_STATE_CONTAINER_PATH:-/workspace/state}/chickens.lock}
      FARM_CHICKENS_CACHE_PATH: ${FARM_CHICKENS_CACHE_CONTAINER_PATH:-/workspace/cache/repositories}
      FARM_CHICKENS_WORKTREES_PATH: ${FARM_CHICKENS_WORKTREES_CONTAINER_PATH:-/workspace/worktrees}
      FARM_CHICKENS_COPILOT_RESOURCES_PATH: ${FARM_CHICKENS_AGENT_OVERRIDES_CONTAINER_PATH:-/workspace/agent-overrides}
      FARM_CHICKENS_COPILOT_PROMPT_PATH: ${FARM_CHICKENS_COPILOT_PROMPT_CONTAINER_PATH:-/workspace/agent-overrides/prompt.md}
      FARM_CHICKENS_COPILOT_AGENT: ${FARM_CHICKENS_COPILOT_AGENT:-}
      FARM_CHICKENS_COPILOT_MODEL: ${FARM_CHICKENS_COPILOT_MODEL:-auto}
      FARM_CHICKENS_SCHEDULE_SECONDS: ${FARM_CHICKENS_SCHEDULE_SECONDS:-3600}
      FARM_CHICKENS_QUIET_PERIOD_SECONDS: ${FARM_CHICKENS_QUIET_PERIOD_SECONDS:-3600}
      FARM_CHICKENS_LEASE_SECONDS: ${FARM_CHICKENS_LEASE_SECONDS:-3600}
      FARM_CHICKENS_RUN_IMMEDIATELY: ${FARM_CHICKENS_RUN_IMMEDIATELY:-true}
      FARM_CHICKENS_WORK_ITEM_MAX_DEPTH: ${FARM_CHICKENS_WORK_ITEM_MAX_DEPTH:-3}
      FARM_CHICKENS_WORK_ITEM_MAX_COUNT: ${FARM_CHICKENS_WORK_ITEM_MAX_COUNT:-50}
      FARM_CHICKENS_VALIDATION_COMMANDS_JSON: ${FARM_CHICKENS_VALIDATION_COMMANDS_JSON:-[]}
      FARM_CHICKENS_SAFE_PROCESS_ENV_JSON: ${FARM_CHICKENS_SAFE_PROCESS_ENV_JSON:-{}}
    volumes:
      - ${FARM_CHICKENS_REPOSITORY_HOST_PATH:?set FARM_CHICKENS_REPOSITORY_HOST_PATH}:${FARM_CHICKENS_REPOSITORY_CONTAINER_PATH:-/workspace/repository}:ro
      - ${FARM_CHICKENS_ARTIFACTS_HOST_PATH:?set FARM_CHICKENS_ARTIFACTS_HOST_PATH}:${FARM_CHICKENS_ARTIFACTS_CONTAINER_PATH:-/workspace/artifacts}
      - ${FARM_CHICKENS_STATE_HOST_PATH:?set FARM_CHICKENS_STATE_HOST_PATH}:${FARM_CHICKENS_STATE_CONTAINER_PATH:-/workspace/state}
      - ${FARM_CHICKENS_CACHE_HOST_PATH:?set FARM_CHICKENS_CACHE_HOST_PATH}:/workspace/cache
      - ${FARM_CHICKENS_WORKTREES_HOST_PATH:?set FARM_CHICKENS_WORKTREES_HOST_PATH}:${FARM_CHICKENS_WORKTREES_CONTAINER_PATH:-/workspace/worktrees}
      # rw (not :ro): Copilot session.create writes a skill/instruction discovery cache into ConfigDirectory
      - ${FARM_CHICKENS_AGENT_OVERRIDES_HOST_PATH:?set FARM_CHICKENS_AGENT_OVERRIDES_HOST_PATH}:${FARM_CHICKENS_AGENT_OVERRIDES_CONTAINER_PATH:-/workspace/agent-overrides}
    user: "1654:1654"
    init: true
    restart: unless-stopped
    privileged: false
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
      - /run:rw,noexec,nosuid,nodev,size=16m,mode=0755
    pids_limit: 256
    mem_limit: ${FARM_CHICKENS_MEMORY_LIMIT:-2g}
    stop_grace_period: 30s
    deploy:
      replicas: 1